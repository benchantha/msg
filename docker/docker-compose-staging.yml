name: direxgo_docker
services:
  direxgo_mysql:
    image: mariadb:10.8
    container_name: direxgo_mysql
    restart: always
    ports:
      - "3306:3306"
    environment:
      MYSQL_ROOT_PASSWORD: "JqVwEoi?8dL}yRzEwdT$^9"
    volumes:
      - ./mysql_data:/var/lib/mysql
      - ./initdb.d:/docker-entrypoint-initdb.d
    networks:
      - direxgo_network

  direxgo_redis:
    image: redis:7.2-alpine
    container_name: direxgo_redis
    restart: always
    volumes:
      - ./redis_data:/data
      - ./redis.conf:/usr/local/etc/redis/redis.conf
    command: redis-server /usr/local/etc/redis/redis.conf
    networks:
      - direxgo_network

  direxgo_app:
    build:
      context: ..
      dockerfile: ./docker/app.Dockerfile
    container_name: direxgo_app
    depends_on:
      - direxgo_mysql
      - direxgo_redis
    working_dir: /var/www/html
    volumes:
      - ../:/var/www/html
    environment:
      APP_NAME: "Direxgo Admin Staging"
      APP_ENV: production
      APP_DEBUG: "false"
      APP_URL: http://localhost:8100
      VITE_ENV: production
      DB_CONNECTION: mysql
      DB_HOST: direxgo_mysql
      DB_DATABASE: direxgo_db
      DB_USERNAME: root
      DB_PASSWORD: "JqVwEoi?8dL}yRzEwdT$^9"
      SESSION_DRIVER: database
      CACHE_STORE: redis
      QUEUE_CONNECTION: redis
      REDIS_CLIENT: phpredis
      REDIS_HOST: direxgo_redis
      REDIS_PORT: 6379
      REDIS_PREFIX: "direxgo:"
      TZ: UTC
    networks:
      - direxgo_network

  direxgo_nginx:
    image: nginx:latest
    container_name: direxgo_nginx
    restart: always
    depends_on:
      - direxgo_app
    ports:
      - "8100:80"
    volumes:
      - ../:/var/www/html
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf
    networks:
      - direxgo_network

networks:
  direxgo_network:
    name: direxgo_network
    driver: bridge
