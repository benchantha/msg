server {
    listen 80;
    server_name admin.direxgo.com;

    root /var/www/html/public;
    index index.php index.html index.htm;

    # Increase file upload limit for large database files (up to 10GB)
    client_max_body_size 10G;

    # Serve .well-known files (Apple App Site Association & Android Asset Links)
    # Apple requires apple-app-site-association to be served with Content-Type: application/json
    # Android's assetlinks.json works automatically due to .json extension
    location /.well-known/ {
        root /var/www/html/public;
        default_type application/json;
        add_header Content-Type application/json always;
        try_files $uri =404;
    }

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    location ~ \.php$ {
        include fastcgi_params;
        fastcgi_pass direxgo_app:9000;
        fastcgi_index index.php;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        
        # Increase timeouts for large file uploads
        fastcgi_read_timeout 7200s;
        fastcgi_send_timeout 7200s;
    }

    location /build/ {
        root /var/www/html/public;
    }

    location ~ /\.ht {
        deny all;
    }

    # Restrict log access (change to allow/configure if internal log viewing needed)
    location /logs {
        deny all;
    }
}