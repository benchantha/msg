# Basic Redis configuration
maxmemory 1gb
maxmemory-policy allkeys-lru
appendonly yes
appendfilename "appendonly.aof"
appendfsync everysec

# Performance tuning
tcp-keepalive 300
timeout 0
tcp-backlog 511

# Snapshotting
save 900 1
save 300 10
save 60 10000

# Security
protected-mode no
bind 0.0.0.0

# Logging
loglevel notice
logfile "/data/redis.log"

# Client connection settings
maxclients 10000 