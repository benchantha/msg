[supervisord]
nodaemon=true

[program:php-fpm]
command=php-fpm
autostart=true
autorestart=true
stderr_logfile=/var/www/html/storage/logs/php-fpm.err.log
stdout_logfile=/var/www/html/storage/logs/php-fpm.out.log

[program:queue-worker]
command=php artisan queue:work --tries=3
autostart=true
autorestart=true
stderr_logfile=/var/www/html/storage/logs/queue-worker.err.log
stdout_logfile=/var/www/html/storage/logs/queue-worker.out.log

[program:laravel-scheduler]
command=php /var/www/html/artisan schedule:work
autostart=true
autorestart=true
stderr_logfile=/var/www/html/storage/logs/scheduler.err.log
stdout_logfile=/var/www/html/storage/logs/scheduler.out.log
